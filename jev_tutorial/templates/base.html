<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Support desk{% endblock %} · Jev</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar"><a class="brand" href="{{ url_for('inbox') }}">Support desk<span>with Jev</span></a><a class="button" href="{{ url_for('new_ticket') }}">New ticket</a></header>
  <div class="shell">
    <nav aria-label="Ticket queues">
      <a href="{{ url_for('inbox') }}">All tickets</a>
      <a href="{{ url_for('inbox', review=1) }}">Needs review</a>
      <p>Teams</p>
      {% for team in teams %}<a href="{{ url_for('inbox', team=team) }}">{{ team | capitalize }}</a>{% endfor %}
      <div class="nav-note">Local tutorial app.<br>Decisions by Jev.<br>Actions controlled by you.</div>
    </nav>
    <main>
      {% for message in get_flashed_messages() %}<p class="notice" role="status">{{ message }}</p>{% endfor %}
      {% block content %}{% endblock %}
    </main>
  </div>
  <script src="{{ url_for('static', filename='forms.js') }}"></script>
</body>
</html>
